<div class="login-page">
  <!-- Left panel: branding -->
  <div class="login-page__brand">
    <div class="login-page__brand-content">
      <div class="login-page__logo">⚙️</div>
      <h1 class="login-page__title">PolicyFlow</h1>
      <p class="login-page__subtitle">
        Diseñador de políticas de negocio<br>basado en flujos de actividades
      </p>

      <div class="login-page__features">
        <div class="login-page__feature">
          <span class="login-page__feature-icon">📋</span>
          <span>Gestión de políticas</span>
        </div>
        <div class="login-page__feature">
          <span class="login-page__feature-icon">🎨</span>
          <span>Diseñador visual con swimlanes</span>
        </div>
        <div class="login-page__feature">
          <span class="login-page__feature-icon">📊</span>
          <span>Monitor en tiempo real</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right panel: form -->
  <div class="login-page__form-panel">
    <div class="login-card">
      <div class="login-card__header">
        <h2 class="login-card__title">Bienvenido</h2>
        <p class="login-card__desc">Ingresá tus credenciales para continuar</p>
      </div>

      <form class="login-card__form" (ngSubmit)="onSubmit()">
        <div class="form-field">
          <label class="form-field__label" for="email">Correo electrónico</label>
          <input
            id="email"
            class="form-field__input"
            type="email"
            placeholder="correo electrónico"
            [(ngModel)]="credentials.email"
            name="email"
            autocomplete="email"
            [disabled]="loading()"
          />
        </div>

        <div class="form-field">
          <label class="form-field__label" for="password">Contraseña</label>
          <input
            id="password"
            class="form-field__input"
            type="password"
            placeholder="••••••••"
            [(ngModel)]="credentials.password"
            name="password"
            autocomplete="current-password"
            [disabled]="loading()"
          />
        </div>

        <div class="login-card__error" *ngIf="error()">
          ⚠️ {{ error() }}
        </div>

        <button
          id="btn-login"
          class="btn-primary"
          type="submit"
          [disabled]="loading()"
        >
          <span *ngIf="!loading()">Iniciar sesión</span>
          <span *ngIf="loading()" class="spinner"></span>
        </button>
      </form>
    </div>
  </div>
</div>
